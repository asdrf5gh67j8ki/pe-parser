<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>pe analyzer</title>
<style>
:root{color-scheme:dark;--bg:#1b1b1b;--panel:#242424;--line:#3a3a3a;--text:#ddd;--muted:#aaa;--selected:#414141;--detail-height:185px}
*{box-sizing:border-box;border-radius:0!important}body{margin:0;height:100vh;min-width:760px;display:grid;grid-template-rows:27px 33px minmax(0,1fr) 24px;background:var(--bg);color:var(--text);font:12px 'Segoe UI',Tahoma,Arial,sans-serif}
button,input,select{font:inherit;color:inherit}button,select{cursor:pointer}button{padding:3px 10px;background:#2a2a2a;border:1px solid #505050;min-height:23px}button:hover{background:#383838}button:active{background:#454545}button:disabled{color:#737373;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:1px solid #ccc;outline-offset:-2px}input,select{background:#202020;border:1px solid #505050;padding:3px 6px;height:24px}input{min-width:120px;width:280px}select{width:124px}.titlebar{display:flex;align-items:center;gap:12px;background:#262626;border-bottom:1px solid var(--line);padding:0 8px;white-space:nowrap}.titlebar strong{font-weight:600}.titlebar #subject{color:#bbb;overflow:hidden;text-overflow:ellipsis;flex:1}.titlebar .version{color:#999}.toolbar{display:flex;align-items:center;gap:6px;padding:4px 7px;border-bottom:1px solid var(--line)}.toolbar .spacer{flex:1}.toolbar label{color:#bbb}.workspace{display:grid;grid-template-columns:185px minmax(0,1fr);grid-template-rows:minmax(100px,1fr) 5px var(--detail-height);min-height:0}.navigation{grid-column:1;grid-row:1/4;overflow:auto;border-right:1px solid #4a4a4a;background:#202020;padding:5px 0}.navigation summary{padding:4px 8px;color:#ddd;cursor:pointer}.navigation button{display:flex;width:100%;min-height:23px;border:0;background:none;text-align:left;align-items:center;gap:8px;padding:3px 10px 3px 24px}.navigation button span:first-child{flex:1}.navigation button span:last-child{color:#aaa;font:11px Consolas,monospace}.navigation button.active{background:var(--selected);color:white}.navigation button:hover{background:#333}.record-pane{min-height:0;min-width:0;display:flex;flex-direction:column}.table-scroll{overflow:auto;flex:1;min-height:0}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}th{position:sticky;top:0;z-index:1;background:#2e2e2e;border-right:1px solid #464646;border-bottom:1px solid #555;height:25px;text-align:left;font-weight:400;padding:0}th button{width:100%;border:0;padding:4px 7px;text-align:left;background:transparent}td{border-bottom:1px solid #333;border-right:1px solid #333;padding:3px 7px;height:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}td.name{padding-left:23px}.item{cursor:default}.item:hover{background:#292929}.item.selected{background:var(--selected);color:#fff}.address,.bytes{font:11px Consolas,'Courier New',monospace}.bytes{text-align:right}.state{color:#bbb}.group td{background:#282828;height:24px;padding:0;border-bottom:1px solid #464646;font-weight:600}.group button{background:transparent;border:0;width:100%;text-align:left;padding:3px 8px;min-height:23px}.group .count{font-weight:400;color:#aaa;margin-left:16px}.pager{height:28px;display:flex;align-items:center;gap:6px;padding:2px 5px;border-top:1px solid var(--line);color:#aaa;background:#222}.pager #position{flex:1}.pager button{min-height:21px;height:21px;padding:1px 8px}.splitter{grid-column:2;cursor:row-resize;background:#363636;border-top:1px solid #515151;border-bottom:1px solid #111}.detail-pane{grid-column:2;min-height:0;display:flex;flex-direction:column;overflow:hidden}.detail-title{display:flex;align-items:center;justify-content:space-between;height:25px;padding:2px 7px;background:#262626;border-bottom:1px solid #414141;color:#bbb}.detail-title button{height:20px;min-height:20px;padding:1px 8px}.detail-title span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-pane pre{flex:1;margin:0;overflow:auto;padding:7px 9px;font:12px/1.6 Consolas,'Courier New',monospace;color:#ddd;white-space:pre}.statusbar{display:flex;align-items:center;gap:0;background:#292929;border-top:1px solid #4d4d4d;padding:0 3px;white-space:nowrap;overflow:hidden}.statusbar span{padding:2px 10px;border-right:1px solid #484848}.statusbar #state{flex:1;overflow:hidden;text-overflow:ellipsis}.empty{padding:14px;color:#aaa}.note{color:#eee;font-weight:600}@media(max-height:550px){:root{--detail-height:110px}}@media(max-width:950px){.workspace{grid-template-columns:160px minmax(0,1fr)}input{width:190px}.toolbar .optional{display:none}}
</style></head><body>
<header class="titlebar"><strong>pe analyzer</strong><span id="subject"></span><span class="version" id="version"></span></header>
<div class="toolbar"><label for="search">Find</label><input id="search" type="search" placeholder="Name, value, address…" aria-label="Search all records"><select id="status" aria-label="Filter status"><option value="">All statuses</option><option>info</option><option>change</option><option>review</option><option>error</option><option>unavailable</option></select><button id="expand">Expand all</button><button id="collapse">Collapse all</button><span class="spacer"></span><span class="optional">Ctrl+F</span><button id="download">Save JSON</button></div>
<div class="workspace"><aside class="navigation"><details open><summary>Analysis</summary><nav id="nav" aria-label="Report categories"></nav></details></aside>
<section class="record-pane" aria-label="Analysis records"><div class="table-scroll"><table aria-label="PE properties"><colgroup><col style="width:23%"><col style="width:44%"><col style="width:19%"><col style="width:6%"><col style="width:8%"></colgroup><thead><tr><th><button data-sort="name">Name</button></th><th><button data-sort="detail">Value</button></th><th><button data-sort="address">Address / offset</button></th><th><button data-sort="size">Bytes</button></th><th><button data-sort="status">Status</button></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>No matching records.</div></div><div class="pager"><span id="position"></span><button id="prev">Previous</button><button id="next">Next</button></div></section>
<div class="splitter" id="splitter" role="separator" tabindex="0" aria-label="Resize detail pane" aria-orientation="horizontal"></div>
<section class="detail-pane" aria-label="Selected record"><div class="detail-title"><span id="detail-title">Details / byte preview</span><button id="copy">Copy details</button></div><pre id="detail">Select a record to inspect its complete value.</pre></section></div>
<footer class="statusbar"><span id="state"></span><span id="totals"></span><span id="time"></span></footer>
<script id="payload" type="application/json">
<!-- REPORT_DATA -->
</script><script>
'use strict';
const data=JSON.parse(document.getElementById('payload').textContent);
const $=id=>document.getElementById(id),rows=data.rows,limit=200,counts=new Map(),collapsed=new Set();
let category='',page=0,filtered=[],selected=null,sortKey='',descending=false,searchTimer;
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function label(s){return s==='iat'?'Import pointers':s==='tls'?'TLS':s.replace(/[-_]/g,' ').replace(/^./,c=>c.toUpperCase());}
rows.forEach(r=>counts.set(r.kind,(counts.get(r.kind)||0)+1));
$('subject').textContent=data.subject;$('subject').title=data.subject;$('version').textContent='v'+data.version;
$('time').textContent=data.started;
$('totals').textContent='Changes: '+data.counts[1]+'  |  Review: '+data.counts[2]+'  |  Unavailable: '+data.counts[4]+'  |  Errors: '+data.counts[3];
const partial=data.failed||data.limited||data.counts[3]||data.counts[4];
function state(text){$('state').textContent=text;$('state').title=text;}
function nav(){
    $('nav').replaceChildren();
    [['',rows.length],...counts].forEach(([kind,count])=>{
        const b=node('button',undefined,kind===category?'active':'');
        b.append(node('span',kind?label(kind):'All records'),node('span',count.toLocaleString()));
        b.setAttribute('aria-pressed',String(kind===category));
        b.onclick=()=>{category=kind;page=0;nav();filter();};$('nav').append(b);
    });
}
function compare(a,b){
    let order=0;
    if(sortKey==='address'){const x=BigInt(a.address),y=BigInt(b.address);order=x<y?-1:x>y?1:0;}
    else if(sortKey==='size')order=a.size-b.size;
    else if(sortKey)order=a[sortKey].localeCompare(b[sortKey]);
    return (descending?-order:order)||a.id-b.id;
}
function filter(){
    const query=$('search').value.toLowerCase(),status=$('status').value;
    filtered=rows.filter(r=>(!category||category===r.kind)&&(!status||status===r.status)&&
        (!query||[r.name,r.detail,r.kind,r.address,r.status].some(v=>v.toLowerCase().includes(query))));
    if(sortKey){
        const order=new Map([...counts.keys()].map((k,i)=>[k,i]));
        filtered.sort((a,b)=>order.get(a.kind)-order.get(b.kind)||compare(a,b));
    }
    page=Math.min(page,Math.max(0,Math.ceil(filtered.length/limit)-1));render();
}
function select(row,element){
    selected=row.id;
    document.querySelectorAll('tr.selected').forEach(e=>{e.classList.remove('selected');e.setAttribute('aria-selected','false');});
    if(element){element.classList.add('selected');element.setAttribute('aria-selected','true');}
    $('detail-title').textContent=label(row.kind)+' / '+row.name;
    $('detail').textContent='Record '+row.id+'  |  '+row.status+'  |  '+row.address+'  |  '+row.size+' bytes\n\n'+row.detail.split(' | ').join('\n');
}
function render(){
    const body=$('rows'),groups=new Map(),fragment=document.createDocumentFragment();body.replaceChildren();
    filtered.slice(page*limit,(page+1)*limit).forEach(r=>{if(!groups.has(r.kind))groups.set(r.kind,[]);groups.get(r.kind).push(r);});
    const matchingCounts=new Map();filtered.forEach(r=>matchingCounts.set(r.kind,(matchingCounts.get(r.kind)||0)+1));
    groups.forEach((items,kind)=>{
        const header=node('tr',undefined,'group'),cell=node('td'),b=node('button');cell.colSpan=5;
        b.append(node('span',(collapsed.has(kind)?'+':'−')+'  '+label(kind)),node('span',matchingCounts.get(kind)+(matchingCounts.get(kind)===1?' record':' records'),'count'));
        b.setAttribute('aria-expanded',String(!collapsed.has(kind)));b.onclick=()=>{if(collapsed.has(kind))collapsed.delete(kind);else collapsed.add(kind);render();};cell.append(b);header.append(cell);fragment.append(header);
        if(collapsed.has(kind))return;
        items.forEach(r=>{
            const tr=node('tr',undefined,'item'+(selected===r.id?' selected':''));tr.tabIndex=0;tr.dataset.id=r.id;tr.setAttribute('aria-selected',String(selected===r.id));
            [[r.name,'name'],[r.detail,'value'],[r.address,'address'],[r.size.toLocaleString(),'bytes'],[r.status,'state']].forEach(([text,cls])=>{const td=node('td',text,cls);td.title=String(text);tr.append(td);});
            tr.onclick=()=>select(r,tr);tr.onfocus=()=>select(r,tr);
            tr.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const visible=[...body.querySelectorAll('.item')],i=visible.indexOf(tr)+(e.key==='ArrowDown'?1:-1);visible[i]?.focus();}};
            fragment.append(tr);
        });
    });body.append(fragment);$('empty').hidden=filtered.length!==0;
    const visible=body.querySelector('tr.item.selected');
    if(!visible){selected=null;$('detail-title').textContent='Details / byte preview';$('detail').textContent='Select a record to inspect its complete value.';}
    $('position').textContent=(filtered.length?page*limit+1:0)+'–'+Math.min((page+1)*limit,filtered.length)+' of '+filtered.length.toLocaleString()+' matching records';
    $('prev').disabled=page===0;$('next').disabled=(page+1)*limit>=filtered.length;
    state((partial?'Partial inspection':'Completed')+' | '+filtered.length.toLocaleString()+' / '+rows.length.toLocaleString()+' records'+(data.limited?' | Output limit reached':'')+(data.failed?' | Allocation failed':''));
}
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=0;filter();},100);};
$('status').onchange=()=>{page=0;filter();};
$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};
$('expand').onclick=()=>{collapsed.clear();render();};$('collapse').onclick=()=>{counts.forEach((_,k)=>collapsed.add(k));render();};
document.querySelectorAll('[data-sort]').forEach(button=>button.onclick=()=>{
    descending=sortKey===button.dataset.sort?!descending:false;sortKey=button.dataset.sort;
    document.querySelectorAll('[data-sort]').forEach(b=>b.parentElement.removeAttribute('aria-sort'));
    button.parentElement.setAttribute('aria-sort',descending?'descending':'ascending');filter();
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['f','k'].includes(e.key.toLowerCase())){e.preventDefault();$('search').focus();$('search').select();}});
$('download').onclick=()=>{
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=node('a');
    a.href=url;a.download='pe-analyzer-report.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$('copy').onclick=async()=>{
    try{await navigator.clipboard.writeText($('detail').textContent);state('Selected record details copied.');}
    catch{const range=document.createRange();range.selectNodeContents($('detail'));const selection=getSelection();selection.removeAllRanges();selection.addRange(range);state('Details selected. Press Ctrl+C to copy.');}
};
const splitter=$('splitter');
function resize(height){document.documentElement.style.setProperty('--detail-height',Math.max(90,Math.min(innerHeight-210,height))+'px');}
splitter.onpointerdown=e=>{splitter.setPointerCapture(e.pointerId);splitter.onpointermove=event=>resize(innerHeight-event.clientY-24);};
splitter.onpointerup=()=>{splitter.onpointermove=null;};splitter.onlostpointercapture=()=>{splitter.onpointermove=null;};
splitter.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();resize(document.querySelector('.detail-pane').clientHeight+(e.key==='ArrowUp'?15:-15));}};
nav();filter();
</script></body></html>
